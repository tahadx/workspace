name: tests

# The tests run the mods' own functions with stubs, so no Herdr is needed.
# `herdr-app check` is the other half and needs a running app; run it locally.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: mod tests
        shell: bash
        run: |
          # Run every file, not just the first failure, and print the failing
          # file's own output. Redirecting it away made the old red runs read
          # "tests/worktree.test.mjs" and then only an exit code.
          set -uo pipefail
          failed=()
          for test in tests/*.test.mjs; do
            printf '\n== %s ==\n' "$test"
            if node "$test"; then
              printf 'PASS %s\n' "$test"
            else
              printf 'FAIL %s\n' "$test"
              failed+=("$test")
            fi
          done
          if (( ${#failed[@]} )); then
            printf '\nFailed %d test(s):\n' "${#failed[@]}"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi
          printf '\nAll %d test files passed.\n' "$(find tests -maxdepth 1 -name '*.test.mjs' | wc -l)"
      - name: install into a scratch Herdr home
        shell: bash
        run: |
          mkdir -p /tmp/herdr-home
          HERDR_APP_HOME=/tmp/herdr-home ./install.sh
          test -f /tmp/herdr-home/layouts/workspace.json
          test -d /tmp/herdr-home/mods/agents-list
          test -d /tmp/herdr-home/mods/command-bar
          test -d /tmp/herdr-home/mods/glass-pane
          test ! -e /tmp/herdr-home/mods/search
          python3 - <<'PY'
          import json
          keys = json.load(open("/tmp/herdr-home/keys.json"))
          layout = keys.get("layout:workspace", {})
          assert layout.get("alt-f") == "mod.open:agents-list", layout
          assert keys["global"].get("ctrl-q") == "overlay.close", keys["global"]
          assert keys["terminal"].get("ctrl-q") == "send:\u0011", keys["terminal"]
          print("keys merged:", len(layout), "layout bindings")
          PY
